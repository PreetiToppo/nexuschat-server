# ?? Server ?????????????????????????????????????????????????????????????????
server.port=8080

# ?? App ????????????????????????????????????????????????????????????????????
spring.application.name=nexuschat-server

# ?? MongoDB ????????????????????????????????????????????????????????????????
spring.data.mongodb.uri=mongodb://localhost:27017/nexuschat

# ?? Redis ??????????????????????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Set a real password in production. Leave blank for local dev with no auth.
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.client-type=lettuce
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# ?? JWT ????????????????????????????????????????????????????????????????????
# Set JWT_SECRET env variable in production. Never commit the real value.
jwt.secret=${JWT_SECRET:nexuschat-super-secret-key-minimum-256-bits-long!!}

# ?? CORS ???????????????????????????????????????????????????????????????????
# Local dev default. In production set CORS_ALLOWED_ORIGINS to your frontend URL.
# Multiple origins: https://app.com,https://www.app.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ?? WebSocket ??????????????????????????????????????????????????????????????
spring.websocket.server.path=/ws

# ?? SSE ????????????????????????????????????????????????????????????????????
# Required for SSE streaming with Spring MVC
spring.mvc.async.request-timeout=30000

# ?? Groq AI ????????????????????????????????????????????????????????????????
# Get a free key at https://console.groq.com
# Set AI_GROQ_API_KEY env variable in production.
ai.groq.api-key=${AI_GROQ_API_KEY:placeholder}
# Model options (all free): llama-3.1-8b-instant (fastest ~500ms, recommended)
# Other options: llama-3.3-70b-versatile, gemma2-9b-it, mixtral-8x7b-32768
ai.groq.model=llama-3.1-8b-instant